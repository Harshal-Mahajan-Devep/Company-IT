<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ezio Infotech — Welcome</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />
    <script>
      (function () {
        const lastTime = localStorage.getItem("ezio_intro_session_time");
        const currentTime = new Date().getTime();
        const EXPIRATION_TIME = 10 * 60 * 1000; // 10 Minutes

        // १० मिनिटांच्या आत परत आल्यास थेट index.html वर पाठवा
        if (
          lastTime &&
          currentTime - parseInt(lastTime, 10) < EXPIRATION_TIME
        ) {
          window.location.replace("index.html");
        }

        // Theme (Dark / Light) Load
        if (localStorage.getItem("ezio-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      /* Light Theme Variables (Default) */
      :root {
        --bg: #f4f1e9;
        --card: #fffdf8;
        --text: #10130f;
        --muted: #6b7168;
        --line: #dedfd6;
        --lime: #baf34b;
        --lime2: #7eaf25;
        --orb-1: #baf34b;
        --orb-2: #9bc8ff;
      }

      /* Dark Theme Variables */
      [data-theme="dark"] {
        --bg: #090d09;
        --card: #121812;
        --text: #f3f6ef;
        --muted: #9aa398;
        --line: #293129;
        --lime: #baf34b;
        --lime2: #7eaf25;
        --orb-1: #baf34b;
        --orb-2: #24426b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      /* Glowing Background Orbs */
      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.25;
        pointer-events: none;
      }
      [data-theme="dark"] .glow-orb {
        opacity: 0.15;
      }

      .orb-1 {
        width: 320px;
        height: 320px;
        background: var(--orb-1);
        top: 15%;
        left: 20%;
        animation: floatGlow 6s ease-in-out infinite alternate;
      }
      .orb-2 {
        width: 280px;
        height: 280px;
        background: var(--orb-2);
        bottom: 15%;
        right: 20%;
        animation: floatGlow 5s ease-in-out infinite alternate-reverse;
      }

      @keyframes floatGlow {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(-30px) scale(1.1);
        }
      }

      .intro-container {
        text-align: center;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        max-width: 480px;
        width: 100%;
      }

      /* Logo Badge */
      .intro-logo-box {
        width: 95px;
        height: 95px;
        border-radius: 26px;
        background: var(--card);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        margin-bottom: 24px;
        animation: logoPop 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      [data-theme="dark"] .intro-logo-box {
        box-shadow:
          0 15px 40px rgba(0, 0, 0, 0.6),
          0 0 35px rgba(186, 243, 75, 0.15);
      }

      .intro-logo-box img {
        width: 58px;
        height: auto;
      }

      /* Brand Heading */
      .intro-brand {
        font-family: "Space Grotesk", sans-serif;
        font-size: 34px;
        font-weight: 700;
        display: flex;
        align-items: baseline;
        gap: 6px;
        color: var(--text);
        opacity: 0;
        transform: translateY(15px);
        animation: fadeInUp 0.8s ease 0.3s forwards;
      }

      .intro-brand span {
        color: var(--lime2);
      }

      .intro-brand small {
        font-family: "DM Sans", sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--muted);
        font-weight: 700;
      }

      /* Tagline */
      .intro-tagline {
        color: var(--muted);
        font-size: 14px;
        margin-top: 10px;
        letter-spacing: 0.5px;
        opacity: 0;
        transform: translateY(15px);
        animation: fadeInUp 0.8s ease 0.5s forwards;
      }

      /* Progress Bar */
      .loader-bar-wrap {
        width: 180px;
        height: 4px;
        background: var(--line);
        border-radius: 10px;
        margin-top: 32px;
        overflow: hidden;
        position: relative;
        opacity: 0;
        animation: fadeIn 0.5s ease 0.7s forwards;
      }

      .loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--lime2), var(--lime));
        border-radius: 10px;
        animation: loadProgress 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
      }

      /* Skip Button */
      .skip-btn {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 10;
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        transition: 0.25s ease;
        opacity: 0;
        animation: fadeIn 0.5s ease 1s forwards;
      }

      .skip-btn:hover {
        background: var(--lime);
        color: #111;
        border-color: var(--lime);
      }

      @keyframes logoPop {
        0% {
          transform: scale(0.6) rotate(-8deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes loadProgress {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }

      body.fade-out {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="intro-container">
      <div class="intro-logo-box">
        <img src="image/eziologo.png" alt="Ezio Infotech" />
      </div>

      <div class="intro-brand">
        EZIO<span>.</span>
        <small>INFOTECH</small>
      </div>

      <p class="intro-tagline">Ideas into digital reality</p>

      <div class="loader-bar-wrap">
        <div class="loader-bar"></div>
      </div>
    </div>

    <a href="index.html" class="skip-btn" id="skipBtn">
      Skip Intro <i class="ri-arrow-right-line"></i>
    </a>

    <script>
      function goToHome() {
        localStorage.setItem(
          "ezio_intro_session_time",
          new Date().getTime().toString(),
        );
        document.body.classList.add("fade-out");
        setTimeout(() => {
          window.location.replace("index.html");
        }, 400);
      }

      // Auto redirect after animation
      setTimeout(goToHome, 2700);

      document
        .getElementById("skipBtn")
        ?.addEventListener("click", function (e) {
          e.preventDefault();
          goToHome();
        });
    </script>
  </body>
</html>
